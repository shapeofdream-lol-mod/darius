name: .NET CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dotnet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository contracts and Release build
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/shapeofdream-lol-mod/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check repository contracts
        shell: pwsh
        run: |
          $meta = Get-Content about/metadata.json -Raw | ConvertFrom-Json
          foreach ($name in 'id', 'name', 'author', 'modVer') {
            if ([string]::IsNullOrWhiteSpace($meta.$name)) { throw "metadata.$name is required" }
          }
          if ($meta.assemblies -notcontains 'DariusPrototype.dll') { throw 'metadata assemblies must contain DariusPrototype.dll' }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch -Pattern "## [$($meta.modVer)]" -Quiet)) { throw "CHANGELOG has no section for $($meta.modVer)" }

          $workshopId = (Get-Content about/publishedfileid.txt -Raw).Trim()
          if ($workshopId -notmatch '^\d+$') { throw 'publishedfileid.txt must contain only digits' }
          if ((Get-Item about/description.txt).Length -gt 8000) { throw 'about/description.txt exceeds 8000 bytes' }

          $bad = @(git ls-files | Where-Object { $_ -match '\.(dll|exe|pdb|glb|ogg|wav|wem|tex|skn|png|jpe?g|bmp|ico|zip|7z|rar|assetbundle)$' })
          if ($bad.Count) { throw "Tracked binary assets/build products:`n$($bad -join "`n")" }

      - name: Check build tooling
        shell: pwsh
        run: |
          $scripts = @(
            'tools/SodReferencePack/New-SodReferencePack.ps1',
            'tools/DariusUnityAssets/Build-NativeModels.ps1'
          )
          foreach ($script in $scripts) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw "$script`n$($errors | Out-String)" }
          }
          python -m py_compile tools/DariusUnityAssets/convert_glb_to_fbx.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native pipeline size
        shell: pwsh
        run: |
          $files = @(
            'src/DariusPrototype/Native/DariusNativeSkinProfiles.cs',
            'src/DariusPrototype/Native/DariusNativeEntityAnimationLeasePatches.cs',
            'src/DariusPrototype/Native/DariusNativeAnimationAdapter.cs',
            'src/DariusPrototype/Native/DariusNativeModelAssets.cs',
            'src/DariusPrototype/Presentation/Model/DariusNativeModelBridge.cs',
            'src/DariusPrototype/Presentation/Model/DariusNativeModelBridge.ActionLease.cs',
            'src/DariusPrototype/Presentation/Model/DariusNativeModelBridge.EntityModel.cs',
            'src/DariusPrototype/Presentation/Model/DariusNativeModelBridge.Playback.cs',
            'src/DariusPrototype/Presentation/Model/DariusNativeModelBridge.Overlays.cs',
            'tools/DariusUnityAssets/Build-NativeModels.ps1',
            'tools/DariusUnityAssets/convert_glb_to_fbx.py'
          )
          $files += @(Get-ChildItem tools/DariusUnityAssets/Editor -Filter '*.cs' -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $count = (Get-Content $file).Count
            if ($count -gt 200) { throw "Native pipeline file exceeds 200 lines: $file ($count)" }
          }

      - name: Check package configuration
        shell: pwsh
        run: |
          dotnet msbuild src/DariusPrototype/DariusPrototype.csproj -t:CheckPackageConfiguration -p:Configuration=Release -nologo -verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet msbuild src/DariusPrototype/DariusPrototype.csproj -t:CheckPackageConfiguration -p:Configuration=Debug -nologo -verbosity:quiet *> $null
          if ($LASTEXITCODE -eq 0) { throw 'CheckPackageConfiguration must reject non-Release packaging' }
          exit 0

      - name: Build Release against SOD reference pack
        shell: pwsh
        run: |
          dotnet build src/DariusPrototype/DariusPrototype.csproj -c Release -p:UseSodReferencePack=true --nologo 2>&1 | Tee-Object -FilePath release-build.log
          exit $LASTEXITCODE

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: warn
          retention-days: 1
