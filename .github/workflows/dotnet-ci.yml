name: .NET CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dotnet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository contracts and Release build
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/shapeofdream-lol-mod/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check repository contracts
        shell: pwsh
        run: |
          $meta = Get-Content about/metadata.json -Raw | ConvertFrom-Json
          foreach ($name in 'id', 'name', 'author', 'modVer') {
            if ([string]::IsNullOrWhiteSpace($meta.$name)) { throw "metadata.$name is required" }
          }
          if ($meta.assemblies -notcontains 'DariusPrototype.dll') { throw 'metadata assemblies must contain DariusPrototype.dll' }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch -Pattern "## [$($meta.modVer)]" -Quiet)) { throw "CHANGELOG has no section for $($meta.modVer)" }

          $workshopId = (Get-Content about/publishedfileid.txt -Raw).Trim()
          if ($workshopId -notmatch '^\d+$') { throw 'publishedfileid.txt must contain only digits' }
          if ((Get-Item about/description.txt).Length -gt 8000) { throw 'about/description.txt exceeds 8000 bytes' }

          $bad = @(git ls-files | Where-Object { $_ -match '\.(dll|exe|pdb|glb|ogg|wav|wem|tex|skn|png|jpe?g|bmp|ico|zip|7z|rar|assetbundle)$' })
          if ($bad.Count) { throw "Tracked binary assets/build products:`n$($bad -join "`n")" }

      - name: Check reference-pack tooling
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/SodReferencePack/New-SodReferencePack.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

      - name: Check package configuration
        shell: pwsh
        run: |
          dotnet msbuild src/DariusPrototype/DariusPrototype.csproj -t:CheckPackageConfiguration -p:Configuration=Release -nologo -verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet msbuild src/DariusPrototype/DariusPrototype.csproj -t:CheckPackageConfiguration -p:Configuration=Debug -nologo -verbosity:quiet *> $null
          if ($LASTEXITCODE -eq 0) { throw 'CheckPackageConfiguration must reject non-Release packaging' }
          exit 0

      - name: Build Release against SOD reference pack
        shell: pwsh
        run: |
          dotnet build src/DariusPrototype/DariusPrototype.csproj -c Release -p:UseSodReferencePack=true --nologo 2>&1 | Tee-Object -FilePath release-build.log
          exit $LASTEXITCODE

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: warn
          retention-days: 1
